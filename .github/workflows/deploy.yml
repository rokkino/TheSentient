name: Deploy Full Stack App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VMIP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Preparazione cartella
            mkdir -p ~/the-sentient
            cd ~/the-sentient
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} .
            else
              git pull origin main
            fi

            # 2. Configurazione Backend (.env)
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" > backend/.env
            # Aggiungi qui altre variabili se necessarie (es. API_KEYS)

            # 3. Aggiornamento Backend
            cd backend
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 delete backend || true
            pm2 start main.py --name backend --interpreter ./venv/bin/python

            # 4. Aggiornamento Frontend
            cd ../frontend
            # Configura l'URL delle API per la build (Risolve il Network Error)
            echo "VITE_API_URL=https://thesentient.duckdns.org/api" > .env
            
            npm install
            # Limitazione RAM per evitare crash su VM e2-micro
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # 5. Permessi e Nginx
            # Permetti a Nginx di leggere i file generati
            sudo chmod -R 755 ~/the-sentient/frontend/dist
            # Riavvio Nginx per attivare HTTPS (porta 443)
            sudo systemctl restart nginx
            
            # 6. Salvataggio PM2 per il riavvio della VM
            pm2 save