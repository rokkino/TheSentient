name: Deploy Full Stack App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VMIP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: GITHUB_TOKEN,REPO_PATH,DATABASE_URL
          script: |
            set -e

            APP_DIR=~/the-sentient
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_PATH}"

            # ── 1. Clone iniziale o navigazione ───────────────────
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ── 2. Sync sicuro (protegge DB locale) ───────────────
            echo "🔄 Fetching latest code..."
            git fetch --all
            git reset --hard origin/main

            # ── 3. Configurazione Backend (.env) ──────────────────
            echo "⚙️  Configuring backend..."
            mkdir -p src/backend/backend
            printf 'DATABASE_URL="%s"\n' "${DATABASE_URL}" > src/backend/backend/.env

            # ── 4. Aggiornamento Backend (Python) ─────────────────
            echo "🐍 Updating backend dependencies..."
            cd "$APP_DIR/src/backend/backend"
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip -q
            pip install -r requirements.txt -q

            # ── 5. Riavvio Backend con PM2 ────────────────────────
            echo "🔁 Restarting backend with PM2..."
            pm2 delete backend 2>/dev/null || true
            pm2 start main.py \
              --name backend \
              --interpreter ./venv/bin/python \
              --cwd "$APP_DIR/src/backend/backend" \
              --log-date-format "YYYY-MM-DD HH:mm:ss" \
              --exp-backoff-restart-delay 5000 \
              -- --port 8000

            # ── 6. Aggiornamento Frontend (Vue/Vite) ──────────────
            echo "🎨 Building frontend..."
            cd "$APP_DIR/src/frontend/frontend"
            echo "VITE_API_URL=https://thesentient.duckdns.org/api" > .env

            LOCK_HASH=$(md5sum package-lock.json | awk '{print $1}')
            PREV_HASH=""
            if [ -f .lock-hash ]; then
              PREV_HASH=$(cat .lock-hash)
            fi
            if [ "$LOCK_HASH" != "$PREV_HASH" ]; then
              echo "📦 package-lock.json changed, running npm install..."
              npm install --legacy-peer-deps
              echo "$LOCK_HASH" > .lock-hash
            else
              echo "⏩ package-lock.json unchanged, skipping npm install"
            fi
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # ── 7. Permessi e Nginx ───────────────────────────────
            echo "🌐 Updating Nginx..."
            sudo chmod -R 755 "$APP_DIR/src/frontend/frontend/dist"
            sudo systemctl restart nginx

            # ── 8. Salvataggio PM2 ────────────────────────────────
            pm2 save
            echo "✅ Deploy completato con successo!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.repository }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}