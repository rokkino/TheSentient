name: Deploy Full Stack App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VMIP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Questo evita che il check dell'host key fallisca
          use_insecure_cipher: true 
          script: |
            mkdir -p ~/the-sentient
            cd ~/the-sentient
            if [ ! -d ".git" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} .
            else
              git pull origin main
            fi

            # CREA IL FILE .ENV AUTOMATICAMENTE
            echo "DATABASE_URL=\"${{ secrets.DATABASE_URL }}\"" > backend/.env

            # --- BACKEND ---
            cd backend
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 delete backend || true
            pm2 start main.py --name backend --interpreter ./venv/bin/python

            # --- FRONTEND ---
            cd ../frontend
            npm install
            # Se la VM ha poca RAM, questo comando potrebbe essere lento
            npm run build