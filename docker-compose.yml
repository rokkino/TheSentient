version: '3.8'

services:
  backend:
    build: ./backend
    container_name: thesentient-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: thesentient-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
